services:
  backend:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3027
      GOMOTION_DATA_DIR: /data
    ports:
      - "127.0.0.1:3027:3027"
    volumes:
      - demotion-data:/data
    stop_grace_period: 30s
volumes:
  demotion-data:
